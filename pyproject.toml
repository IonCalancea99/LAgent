[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagent"
version = "0.1.0"
description = "Autonomous agent framework for large-scale language and action experiments"
requires-python = ">=3.12"
authors = [
    {name = "Ion", email = "ion@lagent.local"}
]

dependencies = [
    "pydantic>=2.11.0,<3.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "pyzmq>=26.0.0,<27.0.0",
    "structlog>=24.0.0,<25.0.0",
    "ultralytics>=8.3.0,<9.0.0",
    "mlflow>=2.12.0,<3.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "yt-dlp>=2024.1.0",
    "opencv-python>=4.8.0,<5.0.0",
    "easyocr>=1.7.0,<2.0.0",
    "dxcam==0.0.5",
    "mss>=9.0.0,<10.0.0",
    "pynput>=1.7.0,<2.0.0",
    "pystray>=0.19.0,<0.20.0",
    "pywin32==306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
lagent-agent = "lagent.agent:main"
lagent-gpu-server = "lagent.gpu_server:main"
lagent-orchestrator = "lagent.orchestrator:main"
lagent-ui = "lagent.ui:main"

[tool.setuptools]
packages = ["lagent", "models"]
